<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- fundo tech: navy profundo -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1730"/>
      <stop offset="1" stop-color="#0E2E5C"/>
    </linearGradient>
    <!-- linha de evolução: ciano -> verde -->
    <linearGradient id="ln" x1="96" y1="372" x2="430" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C7F5"/>
      <stop offset="0.55" stop-color="#1AD1B0"/>
      <stop offset="1" stop-color="#5BE36B"/>
    </linearGradient>
    <!-- área sob a linha -->
    <linearGradient id="area" x1="0" y1="140" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22C7F5" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#22C7F5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.16" r="0.7">
      <stop offset="0" stop-color="#2AA9FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2AA9FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="512" height="512" rx="116"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- brilho no canto superior -->
    <rect width="512" height="512" fill="url(#halo)"/>
    <!-- grade sutil (tech) -->
    <g stroke="#5AA9FF" stroke-width="1.4" opacity="0.10">
      <path d="M96 0V512M192 0V512M288 0V512M384 0V512"/>
      <path d="M0 128H512M0 256H512M0 384H512"/>
    </g>
    <!-- área preenchida -->
    <path d="M96 372 L188 330 L268 348 L344 268 L430 150 L430 512 L96 512 Z" fill="url(#area)"/>
    <!-- linha de evolução com glow -->
    <path d="M96 372 L188 330 L268 348 L344 268 L430 150" fill="none" stroke="url(#ln)"
      stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- pontos de dados -->
    <circle cx="188" cy="330" r="13" fill="#22C7F5"/>
    <circle cx="268" cy="348" r="13" fill="#1AD1B0"/>
    <circle cx="344" cy="268" r="13" fill="#3FDA8C"/>
    <!-- nó final destacado -->
    <circle cx="430" cy="150" r="30" fill="#5BE36B" opacity="0.30"/>
    <circle cx="430" cy="150" r="17" fill="#EAFBF0"/>
    <circle cx="430" cy="150" r="9" fill="#22C7F5"/>
  </g>
  <!-- borda sutil -->
  <rect x="4" y="4" width="504" height="504" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
</svg>
